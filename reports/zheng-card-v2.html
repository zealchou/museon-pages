<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鄭瑛茹 名片 v2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    font-family: 'Noto Serif TC', serif;
  }

  .label {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    color: #888;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  /* 90mm x 54mm @ 6px/mm = 540 x 324px */
  .card {
    width: 540px;
    height: 324px;
    background: #ffffff;
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    display: flex;
    overflow: hidden;
  }

  /* ── LEFT COLUMN ── */
  .col-left {
    width: 116px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 10px 28px 16px;
    gap: 10px;
  }

  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .cpshma-label {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 11px;
    letter-spacing: 2.5px;
    color: #3a3a3a;
    font-weight: 500;
  }

  /* ── DIVIDER ── */
  .divider {
    width: 1px;
    background: #d8d8d8;
    margin: 18px 0;
    flex-shrink: 0;
  }

  /* ── RIGHT COLUMN ── */
  .col-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 22px 26px 20px 22px;
  }

  .org-zh {
    font-size: 16px;
    font-weight: 900;
    color: #111;
    letter-spacing: 0.5px;
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .org-en {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 8.5px;
    color: #666;
    letter-spacing: 0.3px;
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .title-row {
    font-size: 15px;
    font-weight: 700;
    color: #2a2a2a;
    letter-spacing: 3px;
    margin-bottom: 6px;
  }

  .name-row {
    font-size: 32px;
    font-weight: 900;
    color: #111;
    letter-spacing: 12px;
    margin-bottom: 5px;
  }

  .phone-row {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px;
    color: #1a1a1a;
    letter-spacing: 1.5px;
    margin-bottom: 0;
  }

  .contact-block {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 11px;
    color: #3a3a3a;
    line-height: 2.0;
  }

  .note {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 11px;
    color: #aaa;
    margin-top: 24px;
    letter-spacing: 1px;
    text-align: center;
  }
</style>
</head>
<body>

<p class="label">鄭瑛茹 秘書長 ─ 名片預覽 v2（字體放大 / 去除 QR Code）</p>

<div class="card">

  <!-- LEFT -->
  <div class="col-left">
    <div class="logo-wrap">
      <svg width="84" height="84" viewBox="0 0 84 84" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#5dc986"/>
            <stop offset="22%"  stop-color="#44b4d8"/>
            <stop offset="50%"  stop-color="#7575cc"/>
            <stop offset="78%"  stop-color="#c96aad"/>
            <stop offset="100%" stop-color="#e07a6e"/>
          </linearGradient>
        </defs>
        <circle cx="42" cy="42" r="31"
          fill="none"
          stroke="url(#ringGrad)"
          stroke-width="10"
          stroke-linecap="round"
          stroke-dasharray="181 13"
          transform="rotate(-105 42 42)"
        />
      </svg>
      <span class="cpshma-label">CPSHMA</span>
    </div>
  </div>

  <!-- DIVIDER -->
  <div class="divider"></div>

  <!-- RIGHT -->
  <div class="col-right">
    <div>
      <div class="org-zh">社團法人中華身心靈健康管理協會</div>
      <div class="org-en">Chinese Physical Spiritual Health Management Association</div>

      <div class="title-row">秘書長</div>
      <div class="name-row">鄭 瑛 茹</div>
      <div class="phone-row">0935-009-385</div>
    </div>

    <div class="contact-block">
      <div>會址：台北市衡陽路7號15樓</div>
      <div>E-mail：e7172@ms25.hinet.net</div>
      <div>Line：e7172</div>
      <div>統編：42472522</div>
    </div>
  </div>

</div>

<p class="note">v2：字體放大 ／ QR Code 已移除 ／ Logo 彩環居中放大</p>

</body>
</html>
