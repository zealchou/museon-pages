// ===================== BACKGROUND STARS =====================

function createBackgroundStars() {
  const count = 3000;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const r = 120 + Math.random() * 200;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);

    const gold = Math.random() * 0.4;
    colors[i * 3] = 0.9 + gold * 0.1;
    colors[i * 3 + 1] = 0.85 + gold * 0.1;
    colors[i * 3 + 2] = 0.7 + Math.random() * 0.3;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.3,
    vertexColors: true,
    transparent: true,
    opacity: 0.6,
    sizeAttenuation: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });

  scene.add(new THREE.Points(geo, mat));
}

  createTextSprite("MUSEON 星雲", 0, 3.5, 0, "#D4AF37", 18, scene);
}
createCenterStar();

// ===================== TEXT SPRITES =====================

function createTextSprite(text, x, y, z, color, fontSize, parent) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 512;
  canvas.height = 128;

  ctx.clearRect(0, 0, 512, 128);
  ctx.font = `${fontSize || 14}px "Noto Sans TC", "Outfit", sans-serif`;
  ctx.fillStyle = color || '#F7F5F0';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, 256, 64);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;

  const mat = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthWrite: false,
    blending: THREE.NormalBlending,
  });

  const sprite = new THREE.Sprite(mat);
  sprite.position.set(x, y, z);
  sprite.scale.set(8, 2, 1);
  parent.add(sprite);
  return sprite;
}

// ===================== CONSTELLATION PLACEMENT =====================
// Each galaxy arm is in its own tilted THREE.Group.
// The whole scene rotates via OrbitControls autoRotate,
// but each arm sits on a slightly different orbital plane (tiltX).

const constellationMeshes = {};  // id -> { mesh, galaxyKey, data }
const nodeMeshes = [];           // { mesh, index } for wobble animation
const skillParticles = [];       // { pivot, mesh, speed, orbitRadius, baseAngle, parentMesh }
const selectionRings = [];
const crossLinkLines = [];
const galaxyGroups = {};         // key -> THREE.Group (tilted)

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let selectedConstellation = null;

const galaxyKeys = Object.keys(GALAXIES);

// Skill layer → geometry mapping (matches legend: ▲認知 ■方法論 ◆技能 ●工作流 ●審計)
const SKILL_LAYER_GEO = {
  cognitive: () => new THREE.ConeGeometry(0.13, 0.22, 3),
  methodology: () => new THREE.BoxGeometry(0.18, 0.18, 0.18),
  skill: () => new THREE.OctahedronGeometry(0.13),
  workflow: () => new THREE.SphereGeometry(0.12, 8, 8),
  audit: () => new THREE.SphereGeometry(0.10, 8, 8),
};
const SKILL_LAYER_MAP = {
  "deep-think":"cognitive","query-clarity":"cognitive","dharma":"cognitive",
  "philo-dialectic":"cognitive","meta-learning":"cognitive","resonance":"cognitive",
  "xmodel":"methodology","pdeif":"methodology","master-strategy":"methodology",

  "quote-forge":"skill","esg-architect-pro":"skill","meeting-intelligence":"skill",
  "human-design-blueprint":"skill","relationship-dynamics":"skill",
  "biz-diagnostic":"skill","darwin":"skill","course-forge":"skill",
  "brand-project-engine":"skill","script-optimizer":"skill","athena":"skill","ares":"skill",

// Create a tilted group for each galaxy, then place constellations inside
galaxyKeys.forEach((key) => {
  const galaxy = GALAXIES[key];
  const color = new THREE.Color(galaxy.color);
  const nodes = galaxy.constellations;

  // Tilted group for this galaxy's orbital plane
  const group = new THREE.Group();
  group.rotation.x = galaxy.tiltX || 0;
  scene.add(group);
  galaxyGroups[key] = group;

  nodes.forEach((c, idx) => {
    const t = (idx + 0.5) / nodes.length;
    const angle = galaxy.armOffset + t * Math.PI * 1.4 + (Math.random() - 0.5) * 0.3;
    const r = galaxy.orbitR[0] + t * (galaxy.orbitR[1] - galaxy.orbitR[0]);
    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;
    const y = (Math.random() - 0.5) * 2.5;

    // Uniform IcosahedronGeometry for all constellations
    const geo = new THREE.IcosahedronGeometry(0.8, 1);
    const mat = new THREE.MeshPhongMaterial({
      color: color,
      emissive: color,
      emissiveIntensity: c.layer === 'base' ? 0.45 : 0.3,
      transparent: true,
      opacity: 0.9,
      shininess: 60,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.userData = {
      id: c.id, label: c.label, en: c.en, dims: c.dims,
      layer: c.layer, galaxyKey: key, galaxyName: galaxy.name
    };
    group.add(mesh); // add to tilted group, not scene

    // Glow around constellation
    const glowGeo = new THREE.SphereGeometry(0.8 * 1.6, 16, 16);
    const glowMat = new THREE.MeshBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.06,
      side: THREE.BackSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    mesh.add(new THREE.Mesh(glowGeo, glowMat));

    // Label
    createTextSprite(c.label, 0, 1.8, 0, galaxy.color, 14, mesh);

    // Special ABSURDITY label
    if (c.id === 'absurdity') {
      createTextSprite("ABSURDITY", 0, 3.0, 0, "#D4AF37", 16, mesh);
    }

    constellationMeshes[c.id] = { mesh, galaxyKey: key, data: c };
    nodeMeshes.push({ mesh, index: nodeMeshes.length });

    // Create skill orbiting particles (local orbit around this constellation)
    const skills = SKILL_REGISTRY[c.id] || [];
    skills.forEach((skillName, si) => {
      createSkillParticle(mesh, color, si, skills.length, skillName);
    });
  });
});

// ===================== SKILL PARTICLES (local orbit) =====================

function createSkillParticle(parentMesh, baseColor, index, total, skillName) {
  const skillOrbitRadius = 1.2 + Math.random() * 0.8;
  const tiltX = Math.random() * Math.PI;
  const tiltZ = Math.random() * Math.PI;
  const speed = (0.8 + Math.random() * 1.2) * 0.39; // 65% of previous 0.6

  const skillPivot = new THREE.Group();
  skillPivot.rotation.x = tiltX;
  skillPivot.rotation.z = tiltZ;
  parentMesh.add(skillPivot);

  const angle = (index / total) * Math.PI * 2;
  const layer = SKILL_LAYER_MAP[skillName] || "skill";
  const geoFn = SKILL_LAYER_GEO[layer] || SKILL_LAYER_GEO.skill;
  const geo = geoFn();
  const hue = new THREE.Color(baseColor);
  hue.offsetHSL(index * 0.05 - 0.1, 0, 0.1);
  const mat = new THREE.MeshBasicMaterial({
    color: hue,
    transparent: true,
    opacity: 0.7,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(
    Math.cos(angle) * skillOrbitRadius,
    0,
    Math.sin(angle) * skillOrbitRadius
  );
  skillPivot.add(mesh);

  skillParticles.push({ pivot: skillPivot, mesh, speed, orbitRadius: skillOrbitRadius, baseAngle: angle, parentMesh });
}

// ===================== ORBITAL RINGS =====================
// Faint rings at orbitR[0] and orbitR[1] for each galaxy

galaxyKeys.forEach((key) => {
  const galaxy = GALAXIES[key];
  const color = new THREE.Color(galaxy.color);

  [galaxy.orbitR[0], galaxy.orbitR[1]].forEach((dist) => {
    const segments = 128;
    const points = [];
    for (let i = 0; i <= segments; i++) {
      const a = (i / segments) * Math.PI * 2;
      points.push(new THREE.Vector3(Math.cos(a) * dist, 0, Math.sin(a) * dist));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.08,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    galaxyGroups[key].add(new THREE.Line(geo, mat));
  });
});

// ===================== GALACTIC DISK (single Points mesh) =====================
// 4000+ particles spread across all 5 arms using BufferGeometry for performance.
// The spiral arm look comes from arc distribution, NOT from rotation.

function createGalacticDisk() {
  // Create separate Points mesh per galaxy, each in its tilted group
  const perGalaxy = 900;
  galaxyKeys.forEach((key) => {
    const galaxy = GALAXIES[key];
    const galaxyColor = new THREE.Color(galaxy.color);
    const positions = new Float32Array(perGalaxy * 3);
    const colors = new Float32Array(perGalaxy * 3);

    for (let i = 0; i < perGalaxy; i++) {
      const t = Math.random();
      const armAngle = galaxy.armOffset + t * Math.PI * 1.6;
      const r = galaxy.orbitR[0] + t * (galaxy.orbitR[1] - galaxy.orbitR[0]);

      const scatter = (Math.random() - 0.5) * 3.5;
      positions[i * 3]     = Math.cos(armAngle) * r + scatter * Math.sin(armAngle);
      positions[i * 3 + 1] = (Math.random() - 0.5) * 1.5;
      positions[i * 3 + 2] = Math.sin(armAngle) * r - scatter * Math.cos(armAngle);

      const variation = (Math.random() - 0.5) * 0.1;
      colors[i * 3]     = galaxyColor.r + variation;
      colors[i * 3 + 1] = galaxyColor.g + variation;
      colors[i * 3 + 2] = galaxyColor.b + variation;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({
      size: 0.18,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      sizeAttenuation: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });

    galaxyGroups[key].add(new THREE.Points(geo, mat));
  }); // end galaxyKeys.forEach
}
createGalacticDisk();

// ===================== CROSS-LINKS =====================

const crossLinkGroup = new THREE.Group();
scene.add(crossLinkGroup);

function getConstellationWorldPosition(id) {
  const entry = constellationMeshes[id];
  if (!entry) return new THREE.Vector3();
  const pos = new THREE.Vector3();
  entry.mesh.getWorldPosition(pos);
  return pos;
}

function buildCrossLinks() {
  // Remove old
  while (crossLinkGroup.children.length > 0) {
    const child = crossLinkGroup.children[0];
    if (child.geometry) child.geometry.dispose();
    if (child.material) child.material.dispose();
    crossLinkGroup.remove(child);
  }
  crossLinkLines.length = 0;

  CROSS_LINKS.forEach(link => {
    if (link.from === link.to) return;
    const from = getConstellationWorldPosition(link.from);
    const to = getConstellationWorldPosition(link.to);

    let lineColor, dashSize, gapSize, opacity;
    switch (link.type) {
      case 'trigger':
        lineColor = 0xF59E0B;
        dashSize = 0.6;
        gapSize = 0.3;
        opacity = 0.25;
        break;
      case 'boost':
        lineColor = 0x22D3EE;
        dashSize = 0;
        gapSize = 0;
        opacity = 0.2;
        break;
      case 'dampen':
        lineColor = 0xEF4444;
        dashSize = 0.6;
        gapSize = 0.3;
        opacity = 0.25;
        break;
      default:
        lineColor = 0x666666;
        dashSize = 0;
        gapSize = 0;
        opacity = 0.15;
    }

    // Curved line with slight arc
    const mid = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
    mid.y += from.distanceTo(to) * 0.1;

    const curve = new THREE.QuadraticBezierCurve3(from, mid, to);
    const curvePoints = curve.getPoints(32);
    const geo = new THREE.BufferGeometry().setFromPoints(curvePoints);

    let mat;
    if (dashSize > 0) {
      mat = new THREE.LineDashedMaterial({
        color: lineColor,
        transparent: true,
        opacity: opacity,
        dashSize: dashSize,
        gapSize: gapSize,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
    } else {
      mat = new THREE.LineBasicMaterial({
        color: lineColor,
        transparent: true,
        opacity: opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
    }

    const line = new THREE.Line(geo, mat);
    if (dashSize > 0) line.computeLineDistances();

    crossLinkGroup.add(line);
    crossLinkLines.push({ line, link, mat });
  });
}

// ===================== INTERACTION =====================

function onMouseClick(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const meshList = Object.values(constellationMeshes).map(e => e.mesh);
  const intersects = raycaster.intersectObjects(meshList, false);

  if (intersects.length > 0) {
    const hit = intersects[0].object;
    const data = hit.userData;
    if (data && data.id) {
      if (selectedConstellation === data.id) {
        deselectAll(); // toggle off
      } else {
        selectConstellation(data.id);
      }
    }
  } else {
    deselectAll(); // click empty space to deselect
  }
}

function selectConstellation(id) {
  deselectAll();
  selectedConstellation = id;

  const entry = constellationMeshes[id];
  if (!entry) return;

  const data = entry.data;
  const galaxyData = GALAXIES[entry.galaxyKey];

  // Show info panel
  const panel = document.getElementById('info-panel');
  panel.classList.add('visible');
  document.getElementById('info-label').textContent = data.label;
  document.getElementById('info-en').textContent = data.en;
  document.getElementById('info-galaxy').textContent = galaxyData.name;
  document.getElementById('info-layer').textContent = LAYER_LABELS[data.layer] || data.layer;
  document.getElementById('info-dims').textContent = data.dims + ' 維';

  const skillsDiv = document.getElementById('info-skills');
  const skills = SKILL_REGISTRY[id] || [];
  if (skills.length > 0) {
    skillsDiv.innerHTML = skills.map(s => `<span class="skill-tag">${s}</span>`).join('');
  } else {
    skillsDiv.innerHTML = '<span style="color: rgba(247,245,240,0.3); font-size: 11px;">無已註冊 Skill</span>';
  }

  // Highlight mesh
  entry.mesh.material.emissiveIntensity = 0.8;
  entry.mesh.material.opacity = 1.0;

  // Add selection ring
  const ringGeo = new THREE.RingGeometry(1.0, 1.2, 64);
  const ringMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(galaxyData.color),
    transparent: true,
    opacity: 0.6,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const ringMesh = new THREE.Mesh(ringGeo, ringMat);
  ringMesh.lookAt(camera.position);
  entry.mesh.add(ringMesh);
  selectionRings.push(ringMesh);

  // Brighten related cross-links
  crossLinkLines.forEach(cl => {
    if (cl.link.from === id || cl.link.to === id) {
      cl.mat.opacity = 0.7;
    }
  });
}

window.deselectAll = function() {
  selectedConstellation = null;
  document.getElementById('info-panel').classList.remove('visible');

  // Reset all emissive
  Object.values(constellationMeshes).forEach(e => {
    e.mesh.material.emissiveIntensity = e.data.layer === 'base' ? 0.45 : 0.3;
    e.mesh.material.opacity = 0.9;
  });

  // Remove selection rings
  selectionRings.forEach(r => {
    if (r.parent) r.parent.remove(r);
    r.geometry.dispose();
    r.material.dispose();
  });
  selectionRings.length = 0;

  // Reset cross-link opacity
  crossLinkLines.forEach(cl => {
    switch (cl.link.type) {
      case 'trigger': cl.mat.opacity = 0.25; break;
      case 'boost': cl.mat.opacity = 0.2; break;
      case 'dampen': cl.mat.opacity = 0.25; break;
      default: cl.mat.opacity = 0.15;
    }
  });
};

renderer.domElement.addEventListener('click', onMouseClick);

// Touch support
renderer.domElement.addEventListener('touchend', (e) => {
  if (e.changedTouches.length === 1) {
    const touch = e.changedTouches[0];
    const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY };
    onMouseClick(fakeEvent);
  }
});

// ===================== CONTROLS =====================

let autoRotateEnabled = true;

window.toggleRotation = function() {
  autoRotateEnabled = !autoRotateEnabled;
  controls.autoRotate = autoRotateEnabled;
  const btn = document.getElementById('btn-rotate');
  btn.textContent = autoRotateEnabled ? '自動旋轉：開' : '自動旋轉：關';
  btn.classList.toggle('active', autoRotateEnabled);
};

window.resetCamera = function() {
  camera.position.set(0, 25, 45);
  camera.lookAt(0, 0, 0);
  controls.target.set(0, 0, 0);
  controls.update();
};

// ===================== ANIMATION LOOP =====================

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // OrbitControls handles smooth autoRotate for the whole scene view
  controls.update();

  // Center star slow rotation
  centerGroup.rotation.y += 0.003;

  // Per-galaxy differential rotation (inner galaxies faster)
  galaxyKeys.forEach((key) => {
    const galaxy = GALAXIES[key];
    if (galaxyGroups[key] && galaxy.rotSpeed) {
      galaxyGroups[key].rotation.y += galaxy.rotSpeed;
    }
  });

  // Center star pulse
  const pulse = 1.0 + Math.sin(t * 1.5) * 0.08;
  centerGroup.scale.set(pulse, pulse, pulse);

  // Node meshes gentle wobble
  nodeMeshes.forEach(({mesh}, i) => {
    const offset = i * 0.7;
    mesh.rotation.x = t * 0.2 + offset;
    mesh.rotation.z = t * 0.15 + offset;
  });

  // Skill particles orbit their constellations
  const dt = 0.016; // ~60fps fixed step
  skillParticles.forEach(sp => {
    sp.baseAngle += sp.speed * dt;
    sp.mesh.position.set(
      Math.cos(sp.baseAngle) * sp.orbitRadius,
      0,
      Math.sin(sp.baseAngle) * sp.orbitRadius
    );
  });

  // Pulse selection rings
  selectionRings.forEach(r => {
    const p = 0.4 + Math.sin(t * 3) * 0.3;
    r.material.opacity = p;
    r.lookAt(camera.position);
  });

  // Rebuild cross-links positions (world positions change as scene rotates via camera)
  buildCrossLinks();

  renderer.render(scene, camera);
}

// ===================== RESIZE =====================

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===================== START =====================

// Initial cross-link build
buildCrossLinks();

// Update version text
const totalConstellations = Object.keys(constellationMeshes).length;
const totalSkills = Object.values(SKILL_REGISTRY).reduce((sum, arr) => sum + arr.length, 0);
document.getElementById('version-text').textContent = `v4.0 · ${galaxyKeys.length} 星系 · ${totalConstellations} 星座 · ${CROSS_LINKS.length} 連結 · ${totalSkills} Skill 粒子`;

animate();

</script>
