<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寫完一本書｜即將推出</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f7f4ee;
    --ink: #2a2622;
    --muted: #6b6259;
    --accent: #a5342a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --ink: #ece7de;
      --muted: #a89e90;
      --accent: #d16b5f;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }
  .card {
    max-width: 34rem;
    text-align: center;
  }
  .mark {
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    color: var(--accent);
    margin-bottom: 1.2rem;
    text-transform: uppercase;
  }
  h1 {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    line-height: 1.4;
    margin: 0 0 1rem;
    font-weight: 600;
  }
  p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.9;
    margin: 0.6rem 0;
  }
  .rule {
    width: 3rem;
    height: 2px;
    background: var(--accent);
    margin: 1.6rem auto;
    opacity: 0.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">One Muse</div>
    <h1>寫完一本書</h1>
    <div class="rule"></div>
    <p>一個陪你把書真正寫完的地方，正在準備中。</p>
    <p>不是又一個「開始寫」的工具，是幫你「持續寫、寫到完」的陪伴。</p>
  </div>
</body>
</html>
