name = "likai-thisyear"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# new_sqlite_classes 是關鍵：SQLite-backed DO 才在免費方案內。
