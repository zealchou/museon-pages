<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>這一年・下午｜目標設定 × 跨組織溝通</title>
<style>
  :root{
    --paper:#1E1B18; --ink:#E4DCCF; --seal:#CF5D45; --kaki:#D08A45;
    --ink-2:#B9AE9E; --ink-3:#8A7F71; --ink-4:#453E36;
    --hand:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",cursive;
    --book:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
    --u:min(1vw,1.7778vh);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  body{color:var(--ink);font-family:var(--book);-webkit-font-smoothing:antialiased}

  /* 舞台固定 16:9，靠視窗較短邊決定大小，字級一律用 --u，不會因螢幕比例爆版 */
  #stage{position:absolute;inset:0;display:grid;place-items:center}
  .slide{position:relative;width:calc(100*var(--u));height:calc(56.25*var(--u));
         background:var(--paper);overflow:hidden;display:none}
  .slide.on{display:block}
  .bg,.veil{position:absolute;inset:0}
  .bg{background-size:cover;background-position:center bottom;background-repeat:no-repeat}
  .veil{background:linear-gradient(180deg,
        var(--paper) 0%,var(--paper) 76%,
        color-mix(in srgb,var(--paper) 55%,transparent) 88%,
        color-mix(in srgb,var(--paper) 8%,transparent) 100%)}
  .body{position:relative;height:100%;padding:calc(4.2*var(--u)) calc(7*var(--u));
        display:flex;align-items:center;overflow:hidden}
  .fit{width:100%;transform-origin:left center}
  .kicker{font-family:var(--hand);color:var(--seal);font-size:calc(1.7*var(--u));
          letter-spacing:.14em;margin:0 0 calc(1.1*var(--u))}
  .kicker::before{content:"";display:block;width:calc(4*var(--u));height:2px;
                  background:var(--seal);margin:0 0 calc(1*var(--u))}
  h1{font-family:var(--book);font-size:calc(5.4*var(--u));line-height:1.24;
     margin:0 0 calc(1.8*var(--u));font-weight:400;max-width:62%;white-space:pre-line}
  h2{font-family:var(--book);font-size:calc(3.7*var(--u));line-height:1.28;
     margin:0 0 calc(1.7*var(--u));font-weight:400;max-width:64%;white-space:pre-line}
  p{font-family:var(--hand);font-size:calc(2.2*var(--u));line-height:1.68;
    margin:0 0 calc(1.05*var(--u));max-width:60%;white-space:pre-line;color:var(--ink)}
  p.dim{color:var(--ink-2);font-size:calc(1.95*var(--u))}
  .big{font-family:var(--book);font-size:calc(3*var(--u));line-height:1.45;
       max-width:62%;margin:0 0 calc(1.4*var(--u))}
  .seal{color:var(--seal)}
  .nb{white-space:nowrap}
  /* 左右兩欄版面：欄內不再受 max-width 限制，字級另外放大 */
  .two{display:grid;grid-template-columns:1fr 1.05fr;gap:calc(5*var(--u));align-items:center;width:100%}
  .two h2,.two p,.two table,.two .crit,.two ol,.two .big{max-width:100%}
  .two h2{font-size:calc(4.4*var(--u))}
  .two .crit{font-size:calc(2.75*var(--u))}
  .two table{font-size:calc(2.45*var(--u))}
  .two p{font-size:calc(2.45*var(--u))}
  .two p.dim{font-size:calc(2.2*var(--u))}
  .kak{color:var(--kaki)}
  .rule{width:calc(10*var(--u));height:1px;background:var(--ink-4);
        margin:calc(1*var(--u)) 0 calc(2.2*var(--u))}

  /* 判準框：全場最重要的那一句 */
  .crit{border-left:2px solid var(--seal);
        background:color-mix(in srgb,var(--paper) 88%,transparent);
        padding:calc(1.3*var(--u)) calc(1.7*var(--u));max-width:62%;
        font-family:var(--hand);font-size:calc(2.25*var(--u));line-height:1.62;
        margin:calc(.5*var(--u)) 0 0;white-space:pre-line}
  .crit b{font-weight:400;color:var(--seal)}

  table{border-collapse:collapse;max-width:62%;font-family:var(--hand);
        font-size:calc(1.95*var(--u));margin:0 0 calc(1.1*var(--u))}
  th,td{text-align:left;padding:calc(.75*var(--u)) calc(2.2*var(--u)) calc(.75*var(--u)) 0;
        border-bottom:1px solid var(--ink-4);vertical-align:top}
  th{color:var(--seal);font-weight:400;white-space:nowrap}
  td{color:var(--ink)}

  ol,ul{max-width:60%;font-family:var(--hand);font-size:calc(2.1*var(--u));
        line-height:1.7;margin:0 0 calc(1.05*var(--u));padding-left:calc(3*var(--u))}
  li{margin:0 0 calc(.7*var(--u))}
  li b{font-weight:400;color:var(--kaki)}

  .do{position:absolute;top:calc(5*var(--u));right:calc(7*var(--u));
      font-family:var(--hand);font-size:calc(1.7*var(--u));color:var(--seal);
      border:1px solid var(--seal);padding:calc(.5*var(--u)) calc(1.3*var(--u));
      letter-spacing:.1em}
  .mins{position:absolute;bottom:calc(3.4*var(--u));left:calc(7*var(--u));
        font-family:var(--hand);font-size:calc(1.7*var(--u));color:var(--ink-3);
        letter-spacing:.1em}

  /* 頁碼與進度 */
  #hud{position:fixed;bottom:calc(2*var(--u));left:0;right:0;text-align:center;
       font-family:var(--hand);font-size:calc(1.6*var(--u));color:var(--ink-3);
       pointer-events:none;z-index:5}
  #bar{position:fixed;top:0;left:0;height:2px;background:var(--seal);z-index:6;
       transition:width .25s ease}
  #help{position:fixed;bottom:calc(2*var(--u));right:calc(3*var(--u));
        font-family:var(--hand);font-size:calc(1.5*var(--u));color:var(--ink-4);z-index:5}

  /* 手機／平板：左右兩塊真實觸控區（iOS 點空白處不會發出點擊事件，一定要有實體元素） */
  .tap{position:fixed;top:0;bottom:0;width:38%;z-index:10;cursor:pointer;
       -webkit-tap-highlight-color:transparent;display:flex;align-items:center;
       background:transparent;border:0;padding:0}
  #tapL{left:0;justify-content:flex-start}
  #tapR{right:0;justify-content:flex-end}
  .tap span{font-family:var(--book);font-size:calc(3.4*var(--u));color:var(--ink-4);
            padding:0 calc(2*var(--u));user-select:none}
  .tap:active span{color:var(--seal)}
  #rot{position:fixed;inset:auto 0 auto 0;top:calc(50% - 2em);text-align:center;z-index:11;
       font-family:var(--hand);font-size:4.2vw;color:var(--ink-3);display:none;pointer-events:none}
  @media (orientation:portrait) and (max-width:640px){#rot{display:block}}

  /* 目錄（按 O 開關） */
  #toc{position:fixed;inset:0;background:rgba(12,10,9,.96);z-index:20;display:none;
       padding:calc(6*var(--u));overflow:auto}
  #toc.on{display:block}
  #toc h3{font-family:var(--hand);color:var(--seal);font-size:calc(2.2*var(--u));
          margin:0 0 calc(2*var(--u));font-weight:400}
  #toc ol{max-width:none;columns:2;column-gap:calc(6*var(--u));font-size:calc(2*var(--u))}
  #toc li{cursor:pointer}
  #toc li:hover{color:var(--seal)}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div id="hud"></div>
<button class="tap" id="tapL" aria-label="上一頁"><span>‹</span></button>
<button class="tap" id="tapR" aria-label="下一頁"><span>›</span></button>
<div id="rot">手機請橫著拿</div>
<div id="help">← → 或點左右／滑動　F 全螢幕　O 目錄　B 黑幕</div>
<div id="toc"><h3>目錄（點一下跳過去）</h3><ol id="toclist"></ol></div>

<script>
/* 每一頁：n 標題（目錄用）、m 分鐘、d 是否需要學員動手、h 內文 HTML。
   背景圖固定對應 /deck/sNN.jpg，圖還沒到就只是純色底，不影響上台。 */
const S=[
{n:'封面',im:'s01',m:'',h:`
  <p class="kicker">2026 / 09 / 09　下午</p>
  <h1>這一年<span class="seal">・</span>下午</h1>
  <p class="big">目標設定 × 跨組織溝通</p>
  <p class="dim">上午你們玩完了一年。\n下午我們把它變成下週一會做的事。</p>`},

{n:'① 人原生沒有目標',im:'s03',m:'10 分',h:`
  <p class="kicker">① 第一性原理</p>
  <h2>人原生沒有目標。\n原生有的是需求。</h2>
  <p>餓了要吃、怕了要躲、被看見了會想再做一次。\n這些不用教。</p>
  <div class="crit">目標是人造的工具。它唯一的功能是——\n<b>把「現在要付出」跟「以後才拿到」接起來。</b>\n\n所以目標不是拿來管人的，\n是拿來讓人撐過還沒有回報的那一段。</div>`},

{n:'② 團隊四感',im:'s04',m:'20 分',d:1,h:`
  <p class="kicker">② 團隊要運作得好，需要什麼</p>
  <h2>四感</h2>
  <table>
    <tr><th>使命感</th><td>找到方向、點燃渴望、採取行動</td></tr>
    <tr><th>幸福感</th><td>生存沒壓力、情緒有人接</td></tr>
    <tr><th>成就感</th><td>持續學習、成長，看得到未來</td></tr>
    <tr><th>滿足感</th><td>付出感受到立即回饋——名聲、權利、利益</td></tr>
  </table>
  <p class="dim">現在每個人四感各打 1 到 5 分，寫上白板。\n五個人的分數攤開，就是這家公司的真實狀態。</p>`},

{n:'② 四感要靠制度落實',im:'s05',m:'',h:`
  <p class="kicker">② 四感不會自己發生</p>
  <h2 style="max-width:80%">公司的發展、品牌的理念與<span class="nb">精神</span>，\n如何落實成這四感——\n那是經營層級要用心的地方。</h2>
  <p>制度，也應該依據這個原則去制定。</p>
  <div class="crit"><b>當這件事情沒有發生，\n團隊就會開始內耗。</b></div>`},

{n:'③ 把不同需求串起來',im:'s06',m:'10 分',h:`
  <p class="kicker">③ 目標設定的真正工作</p>
  <h2>五個人要的本來就不一樣。</h2>
  <p class="dim">業務要成交　倉管要不出錯　會計要不被追\n客服要不被罵　副總要交代得過去</p>
  <div class="rule"></div>
  <p>目標的工作<span class="seal">不是</span>叫大家想要同一件事，\n是讓五個不同的想要，<span class="kak">走同一條路才拿得到</span>。</p>
  <div class="crit">判準：<b>如果某個人達成他要的，\n會害另一個人拿不到他要的——\n那目標就還沒有設完。</b>\n\n上午每一場，都是這個結構。</div>`},

{n:'③ 個人目標與落差',im:'s02',m:'10 分',h:`
  <p class="kicker">③ 從企業的目標往下</p>
  <h2>怎麼設定個人目標？\n先問他自己想設定什麼。</h2>
  <p>不論他自己設定的目標是多少——\n跟公司、跟主管心裡想要的那個目標對比，\n<span class="kak">通常都會有落差。</span></p>
  <div class="crit"><b>這個落差不是問題，是資訊。</b>\n它正好可以拿來檢視：\n這家公司的四感，到底被設成了什麼樣子。</div>`},

{n:'④ 落差怎麼讀',im:'s07',m:'15 分',h:`
  <p class="kicker">④ 落差怎麼讀</p>
  <h2>他設得太低，或設得太高，\n讀的是兩件不同的事。</h2>
  <table>
    <tr><th>設定太低</th><td>要去看：<b>為什麼沒辦法讓員工有信心。</b></td></tr>
    <tr><th>設定太高</th><td>表示不落地、不切實際、跟環境脫節。<br>
      <span style="color:var(--ink-3)">可以直接問：「如果沒達成，你說得出是哪一步卡住嗎？」</span></td></tr>
  </table>
  <div class="crit"><b>兩種都是關鍵資訊——\n拿來看怎麼調整公司，或怎麼調整這個人。</b></div>`},

{n:'④ 連三次規則',im:'s08',m:'',h:`
  <p class="kicker">④</p>
  <h1>連贏三次才是贏。\n連輸三次才是輸。</h1>`},

{n:'⑤ 知識還是教練',im:'s09',m:'10 分',h:`
  <p class="kicker">⑤ 什麼時候給知識，什麼時候當教練</p>
  <h2>判準只有一句。</h2>
  <table>
    <tr><th>給知識</th><td>對方缺的是「不知道怎麼做」</td></tr>
    <tr><th>當教練</th><td>對方缺的是「知道，但沒做、不敢做」</td></tr>
  </table>`},

{n:'⑥ 可能性與天賦天缺',im:'s10',m:'10 分',h:`
  <p class="kicker">⑥ 相信可能性，但是——</p>
  <h2>相信每個人有可能性，\n不等於相信每個人都能變成任何樣子。</h2>
  <table>
    <tr><th>天賦</th><td>做起來比別人省力</td></tr>
    <tr><th>天缺</th><td>做起來特別費力，練了也只到及格</td></tr>
  </table>
  <div class="crit"><b>天缺不是要修的，是要交接的。</b>\n\n這正是上午的機制——\n五張角色卡拼起來才有答案。\n\n目標放在天賦上，天缺用交接補。</div>`},

{n:'⑦ 打罵只能讓人停止',im:'s11',m:'10 分',h:`
  <p class="kicker">⑦ 傳統打罵教育，對團隊做了什麼</p>
  <h2>打罵有效的只有一件事：\n讓人「停止」某個行為。</h2>
  <p>對「<span class="kak">開始</span>某個行為」，它完全無效。</p>
  <p>而團隊要的幾乎全部都是開始——\n開始問、開始說壞消息、開始提醒別人。</p>
  <div class="crit">所以打罵帶出來的團隊，\n最會的是<b>「不要被抓到」</b>。\n\n上午那面白板上寫的\n「不好意思問」「怕被說不懂」——\n那是被訓練出來的。</div>`},

{n:'⑦ 誇誇為什麼有效',im:'s12',m:'',h:`
  <p class="kicker">⑦ 誇誇文化為什麼能改變一個人</p>
  <h2>不是因為讓人開心。</h2>
  <div class="crit">是因為它<b>精準指認了\n哪一個具體動作值得再做一次</b>。</div>
  <p style="margin-top:calc(2*var(--u))">所以誇誇不是灌美言，是<span class="kak">指認</span>。</p>
  <div class="crit">判準：<b>你誇的那句話，\n對方聽完知不知道下次要重複哪個動作？</b>\n\n不知道 ⇒ 那只是客套，不會改變任何事。</div>`},

{n:'⑧ 對自己君親師',im:'s13',m:'15 分',d:1,h:`
  <div class="two">
    <div>
      <p class="kicker">⑧ 在幫別人設目標之前</p>
      <h2>我如何愛自己，\n就會如何愛別人。</h2>
      <table>
        <tr><th>君</th><td>給自己標準與方向</td></tr>
        <tr><th>親</th><td>無條件接住自己</td></tr>
        <tr><th>師</th><td>教自己，給自己誠實的回饋</td></tr>
      </table>
    </div>
    <div>
      <div class="crit">判準：\n<b>你對自己最缺的那一角，\n就是你帶人時最缺的那一角。</b></div>
      <p style="margin-top:calc(1.6*var(--u))">只有君 → 帶人只會要求\n只有親 → 帶人變鄉願\n只有師 → 只評論、不承擔</p>
      <p class="dim">現在每個人自評三角，\n寫下最缺的那一角。</p>
    </div>
  </div>`},

{n:'⑨ 收穫三句',im:'s14',m:'15 分',d:1,h:`
  <p class="kicker">⑨ 帶走的東西</p>
  <h2>寫三句就好。</h2>
  <ol>
    <li>今天我最有感的<b>一句話</b>是——</li>
    <li>下週一我要開始做的<b>一個動作</b>——<br>
        <span style="color:var(--ink-3);font-size:calc(2*var(--u))">具體到「我要問誰、要什麼欄位」</span></li>
    <li>我希望<b>誰</b>幫我盯——</li>
  </ol>
  <p class="dim">寫完念出來。念出來的承諾，跟寫在紙上的不一樣。</p>`}
];

const stage=document.getElementById('stage'),hud=document.getElementById('hud'),
      bar=document.getElementById('bar'),toc=document.getElementById('toc'),
      toclist=document.getElementById('toclist');
let i=0,black=false;

S.forEach((s,k)=>{
  const el=document.createElement('div');
  el.className='slide';
  const img=`/deck/${s.im}.jpg`;
  el.innerHTML=`<div class="bg" style="background-image:url('${img}')"></div><div class="veil"></div>
    <div class="body">${s.d?'<span class="do">學員動手</span>':''}<div class="fit">${s.h}</div></div>`;
  stage.appendChild(el);
  const li=document.createElement('li');
  li.textContent=s.n; li.onclick=()=>{go(k);toc.classList.remove('on')};
  toclist.appendChild(li);
});
const slides=[...document.querySelectorAll('.slide')];

// 每一頁自動放到剛好填滿版面：內容少就放大，內容多才縮小，永遠不會被切到
function fitSlide(el){
  const box=el.querySelector('.body'),inner=el.querySelector('.fit');
  inner.style.transform='none';
  const pad=parseFloat(getComputedStyle(box).paddingTop);
  const availH=box.clientHeight-pad*2, needH=inner.scrollHeight;
  // 內容實際佔掉的寬度（取最右邊那個元素），拿來算橫向還能放多大
  const L=inner.getBoundingClientRect().left;
  let needW=1;
  inner.querySelectorAll(':scope > *').forEach(c=>{
    c.querySelectorAll('*').forEach(g=>{const r=g.getBoundingClientRect().right-L;if(r>needW)needW=r});
    const r=c.getBoundingClientRect().right-L; if(r>needW)needW=r;
  });
  const availW=inner.clientWidth;
  const k=Math.min(availH/needH, availW/needW, 1.55);
  inner.style.transform=`scale(${k.toFixed(4)})`;
}
function go(n){
  i=Math.max(0,Math.min(S.length-1,n));
  slides.forEach((el,k)=>el.classList.toggle('on',k===i));
  fitSlide(slides[i]);
  hud.textContent=`${i+1} / ${S.length}　${S[i].n}${S[i].m?'　·　'+S[i].m:''}`;
  bar.style.width=((i+1)/S.length*100)+'%';
  location.hash=i+1;
}
// 全部圖先預載，上台翻頁不會等圖
S.forEach(s=>{const im=new Image();im.src=`/deck/${s.im}.jpg`});

addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'||e.key==='Enter')return go(i+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='Backspace')return go(i-1);
  if(e.key==='Home')return go(0);
  if(e.key==='End')return go(S.length-1);
  if(e.key==='f'||e.key==='F')return document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  if(e.key==='o'||e.key==='O')return toc.classList.toggle('on');
  if(e.key==='b'||e.key==='B'){black=!black;document.body.style.visibility=black?'hidden':'visible';return}
  if(e.key==='Escape')return toc.classList.remove('on');
});
// 左右觸控區（實體 button，iOS 才收得到）
document.getElementById('tapL').addEventListener('click',e=>{e.stopPropagation();go(i-1)});
document.getElementById('tapR').addEventListener('click',e=>{e.stopPropagation();go(i+1)});
// 左右滑動翻頁
let tx=0,ty=0;
addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY},{passive:true});
addEventListener('touchend',e=>{
  if(toc.classList.contains('on'))return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))go(dx<0?i+1:i-1);
},{passive:true});
const fromHash=()=>go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
addEventListener('hashchange',fromHash);
addEventListener('resize',()=>fitSlide(slides[i]));
fromHash();
</script>
</body>
</html>
