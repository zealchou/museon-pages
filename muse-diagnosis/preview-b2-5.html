<body>
  <div id="app" data-testid="app"></div>
  <script>/**
 * 商模十二力的 deterministic scoring core.
 *
 * This module intentionally has no DOM, storage, network, Kairos, or content
 * imports.  Callers pass cards and a state in, then receive a new state out.
 * B2.5 is responsible for displaying the returned planning data.
 */

const FORCE_IDS = Object.freeze([
  "BF01", "BF02", "BF03", "BF04", "BF05", "BF06",
  "BF07", "BF08", "BF09", "BF10", "BF11", "BF12",
]);

const LANE_ORDER = Object.freeze(["sprint", "sustain", "nurture", "foundation"]);

const FORCE_LANES = Object.freeze({
  BF01: "sprint", BF11: "sprint", BF12: "sprint",
  BF09: "sustain", BF06: "sustain", BF04: "sustain",
  BF07: "nurture", BF03: "nurture", BF08: "nurture",
  BF02: "foundation", BF05: "foundation", BF10: "foundation",
});

const ANCHOR_TARGETS = Object.freeze({ strong: 4.5, middling: 3.0, weak: 1.5 });
const FREQUENCY_LEVELS = Object.freeze([0.5, 1.5, 2.5, 3.5, 4.5]);
const STABILITY_LEVELS = Object.freeze(["once", "occasional", "fixed"]);

const LEARNING_RATE = 0.60;
const SIGMA_MIN = 0.25;
const CHOICE_WEIGHT = 0.45;
const RECALL_WEIGHT = 0.70;
const ANCHOR_WEIGHT = 1.00;
const CARD_ID_RE = /^[a-z0-9-]{1,40}$/;
const CORRECTION_FIELDS = new Set(["lane", "headline_force", "phi", "omega", "symptom"]);
const CORRECTION_AT = new Set(["A", "B", "C", "conclusion"]);
const CORRECTION_VIA = new Set(["option", "self_pick"]);

function clone(value) {
  return structuredClone(value);
}

function clampTheta(value) {
  return Math.min(5, Math.max(0, value));
}

function compareForceId(left, right) {
  return left.localeCompare(right, "en");
}

function compareCardId(left, right) {
  return left.card_id.localeCompare(right.card_id, "en");
}

function requireForce(force) {
  if (!FORCE_IDS.includes(force)) throw new Error(`unknown force: ${force}`);
}

function requireLane(lane) {
  if (!LANE_ORDER.includes(lane)) throw new Error(`unknown lane: ${lane}`);
}

function forceEntry(state, force) {
  requireForce(force);
  const entry = state.forces?.[force];
  if (!entry) throw new Error(`state is missing force: ${force}`);
  return entry;
}

function setEvidence(entry) {
  entry.evidence_ratio = entry.n_obs === 0 ? 0 : entry.w_sum / entry.n_obs;
}

function recordObservation(entry, weight) {
  entry.n_obs += 1;
  entry.w_sum += weight;
  setEvidence(entry);
}

function anchorTarget(anchor) {
  const target = ANCHOR_TARGETS[anchor];
  if (target === undefined) throw new Error(`invalid theta anchor: ${anchor}`);
  return target;
}

function normalizeStability(level) {
  const aliases = {
    "做過一兩次": "once",
    "想到才做": "occasional",
    "有固定週期": "fixed",
  };
  const normalized = aliases[level] ?? level;
  if (!STABILITY_LEVELS.includes(normalized)) throw new Error(`invalid stability level: ${level}`);
  return normalized;
}

function cardFor(state, cardOrId) {
  const cardId = typeof cardOrId === "string" ? cardOrId : cardOrId?.card_id;
  const card = state.cards.find((item) => item.card_id === cardId);
  if (!card) throw new Error(`unknown card: ${cardId}`);
  return card;
}

function assertCardShape(card) {
  if (!card || typeof card !== "object") throw new Error("card must be an object");
  if (typeof card.card_id !== "string" || !CARD_ID_RE.test(card.card_id)) throw new Error(`invalid card_id: ${card.card_id}`);
  requireForce(card.force);
  if (!new Set(["theta", "phi", "omega", "stability"]).has(card.card_kind)) throw new Error(`invalid card_kind: ${card.card_kind}`);

  if (card.card_kind === "theta") {
    anchorTarget(card.anchor);
    if (!new Set(["r2", "r3"]).has(card.round_scope)) throw new Error(`invalid round_scope: ${card.round_scope}`);
    if (!Number.isInteger(card.variant) || card.variant < 1) throw new Error(`invalid variant for ${card.card_id}`);
    return;
  }

  if (Object.hasOwn(card, "anchor")) throw new Error(`${card.card_kind} card must not carry anchor: ${card.card_id}`);
  if (card.card_kind === "phi" && ![0, 1, 2].includes(card.phi_level)) throw new Error(`invalid phi_level: ${card.card_id}`);
  if (card.card_kind === "omega" && !["owner", "team", "none"].includes(card.omega_value)) throw new Error(`invalid omega_value: ${card.card_id}`);
  if (card.card_kind === "stability") normalizeStability(card.stability_level);
}

function allCombinations(items, size = 3) {
  const results = [];
  for (let first = 0; first < items.length - 2; first += 1) {
    for (let second = first + 1; second < items.length - 1; second += 1) {
      for (let third = second + 1; third < items.length; third += 1) results.push([items[first], items[second], items[third]]);
    }
  }
  return results;
}

function lexicalCombo(combo) {
  return [...combo].sort(compareForceId).join("|");
}

function softmaxSpreadObjective(state, combo) {
  const exponentials = combo.map((force) => Math.exp(forceEntry(state, force).theta));
  const total = exponentials.reduce((sum, value) => sum + value, 0);
  const maxSoftmax = Math.max(...exponentials.map((value) => value / total));
  const sigmaSum = combo.reduce((sum, force) => sum + forceEntry(state, force).sigma, 0);
  return sigmaSum * (1 - maxSoftmax);
}

function laneConstraint(roundScope, focusLane, firstAfterLaneOverride, level) {
  if (roundScope === "r2") {
    if (level === 0) return (combo) => new Set(combo.map((force) => FORCE_LANES[force])).size === 3;
    if (level === 1) return (combo) => new Set(combo.map((force) => FORCE_LANES[force])).size >= 2;
    return () => true;
  }

  if (!focusLane) throw new Error("r3 selection requires focus_lane");
  if (firstAfterLaneOverride && level === 0) return (combo) => combo.every((force) => FORCE_LANES[force] === focusLane);
  const adjustedLevel = firstAfterLaneOverride ? level - 1 : level;
  if (adjustedLevel === 0) return (combo) => combo.filter((force) => FORCE_LANES[force] === focusLane).length >= 2;
  if (adjustedLevel === 1) return (combo) => combo.filter((force) => FORCE_LANES[force] === focusLane).length >= 1;
  return () => true;
}

function maxConstraintLevel(roundScope, firstAfterLaneOverride) {
  if (roundScope === "r2") return 2;
  return firstAfterLaneOverride ? 3 : 2;
}

function cardCandidatesForForce(state, force, roundScope) {
  return state.cards.filter((card) => (
    card.card_kind === "theta"
    && card.force === force
    && card.round_scope === roundScope
    && !state.shown.card_ids.includes(card.card_id)
  ));
}

function preferredCard(state, force, roundScope) {
  const currentTheta = forceEntry(state, force).theta;
  const candidates = cardCandidatesForForce(state, force, roundScope);
  if (candidates.length === 0) return null;
  return candidates.sort((left, right) => {
    const distance = Math.abs(anchorTarget(right.anchor) - currentTheta) - Math.abs(anchorTarget(left.anchor) - currentTheta);
    if (distance !== 0) return distance;
    if (left.variant !== right.variant) return left.variant - right.variant;
    return compareCardId(left, right);
  })[0];
}

function markCardsShown(state, cards, triplet) {
  const next = clone(state);
  const ids = cards.map((card) => card.card_id);
  if (new Set(ids).size !== ids.length) throw new Error("a triplet cannot repeat a card");
  if (ids.some((id) => next.shown.card_ids.includes(id))) throw new Error("a shown card cannot be selected again");
  next.shown.card_ids.push(...ids);
  if (triplet) next.shown.triplets += 1;
  for (const card of cards) {
    next.shown.force_counts[card.force] += 1;
    next.shown.lane_counts[FORCE_LANES[card.force]] += 1;
  }
  return next;
}

function correctionEvent(event) {
  const keys = ["at", "round", "field", "system_value", "user_value", "via"];
  if (!event || keys.some((key) => !Object.hasOwn(event, key))) throw new Error("correction must contain all six fields");
  if (!CORRECTION_AT.has(event.at) || !CORRECTION_FIELDS.has(event.field) || !CORRECTION_VIA.has(event.via)) throw new Error("invalid correction enum");
  if (!Number.isInteger(event.round) || event.round < 2 || event.round > 5) throw new Error("invalid correction round");
  return Object.fromEntries(keys.map((key) => [key, event[key]]));
}

function applyCapabilitySettling(next) {
  if (next.capability.phi_raw === null || next.capability.stability === null) return next;
  const result = settlePhi(next.capability.phi_raw, next.capability.stability);
  next.capability.phi = result.phi;
  next.capability.inconsistent = result.inconsistent;
  return next;
}

/** Creates the single B2 state boundary. */
function createDiagnosisState({ cards = [], openingTriplet = [] } = {}) {
  const ids = new Set();
  for (const card of cards) {
    assertCardShape(card);
    if (ids.has(card.card_id)) throw new Error(`duplicate card_id: ${card.card_id}`);
    ids.add(card.card_id);
  }
  if (openingTriplet.length > 0) validateOpeningTriplet(cards, openingTriplet);

  const forceCounts = Object.fromEntries(FORCE_IDS.map((force) => [force, 0]));
  const laneCounts = Object.fromEntries(LANE_ORDER.map((lane) => [lane, 0]));
  return {
    forces: Object.fromEntries(FORCE_IDS.map((force) => [force, {
      theta: 2.5, sigma: 1.2, n_obs: 0, w_sum: 0, evidence_ratio: 0, deprioritized: false,
    }])),
    cards: clone(cards),
    opening_triplet: [...openingTriplet],
    shown: { card_ids: [], triplets: 0, force_counts: forceCounts, lane_counts: laneCounts },
    focus_lane: null,
    headline_force: null,
    corrections: [],
    debug: { lane_constraint_relaxed: [] },
    capability: { phi_raw: null, stability: null, phi: null, omega: null, inconsistent: false, stability_skipped: false },
    budget: { missing_stability_note: false, alignment_summary_variant: "full", conclusion_sections: [] },
  };
}

/** Validates the content-owned, fixed first r2 triplet without owning its copy. */
function validateOpeningTriplet(cards, openingTriplet) {
  if (!Array.isArray(openingTriplet) || openingTriplet.length !== 3 || new Set(openingTriplet).size !== 3) {
    throw new Error("opening_triplet must contain exactly three distinct card_id values");
  }
  const selected = openingTriplet.map((cardId) => cards.find((card) => card.card_id === cardId));
  if (selected.some((card) => !card)) throw new Error("opening_triplet references an unknown card");
  for (const card of selected) {
    assertCardShape(card);
    if (card.card_kind !== "theta" || card.round_scope !== "r2") throw new Error("opening_triplet must contain r2 theta cards");
  }
  if (new Set(selected.map((card) => FORCE_LANES[card.force])).size !== 3) throw new Error("opening_triplet must span three lanes");
  return selected;
}

/** Selects the fixed opening cards and records their exposure. */
function pickOpeningTriplet(state) {
  const cards = validateOpeningTriplet(state.cards, state.opening_triplet);
  return { state: markCardsShown(state, cards, true), cards, trace: { source: "opening_triplet", final_k: null, lane_constraint_relaxed: [] } };
}

/** Returns scores used by the deterministic theta card selector. */
function tripletScores(state) {
  const tripletCount = state.shown.triplets;
  return Object.fromEntries(FORCE_IDS.map((force) => {
    const lane = FORCE_LANES[force];
    const laneUnderexposure = Math.max(0, 1 - state.shown.lane_counts[lane] / Math.max(1, (3 * tripletCount) / 4));
    const exposure = state.shown.force_counts[force] / (1 + state.shown.force_counts[force]);
    const focus = state.focus_lane === lane ? 1 : 0;
    return [force, forceEntry(state, force).sigma + 0.35 * laneUnderexposure - 0.30 * exposure + 1.2 * focus];
  }));
}

/**
 * Deterministically picks three theta cards.  It expands K to 12 before
 * relaxing lane constraints, and records every relaxation in state.debug.
 */
function pickTriplet(state, { roundScope, firstAfterLaneOverride = state.r3_first_pending === true } = {}) {
  if (!new Set(["r2", "r3"]).has(roundScope)) throw new Error("pickTriplet requires roundScope r2 or r3");
  const eligible = FORCE_IDS.filter((force) => preferredCard(state, force, roundScope) !== null);
  if (eligible.length < 3) {
    console.error(`B2 fail-loud: fewer than three ${roundScope} theta cards remain`);
    return { state: clone(state), cards: [], trace: { fail_loud: "insufficient_cards", final_k: null, lane_constraint_relaxed: [] } };
  }

  const scores = tripletScores(state);
  const ranked = [...eligible].sort((left, right) => scores[right] - scores[left] || compareForceId(left, right));
  const relaxed = [];
  let chosenForces = null;
  let finalK = null;
  let maxKAttempted = 0;
  const kAttempts = [];
  for (let level = 0; level <= maxConstraintLevel(roundScope, firstAfterLaneOverride); level += 1) {
    const accepts = laneConstraint(roundScope, state.focus_lane, firstAfterLaneOverride, level);
    for (let k = 6; k <= 12; k += 3) {
      finalK = k;
      maxKAttempted = Math.max(maxKAttempted, k);
      kAttempts.push({ constraint_level: level, k });
      const candidateForces = ranked.slice(0, Math.min(k, ranked.length));
      const valid = allCombinations(candidateForces).filter(accepts);
      if (valid.length === 0) continue;
      chosenForces = valid.sort((left, right) => {
        const objective = softmaxSpreadObjective(state, right) - softmaxSpreadObjective(state, left);
        return objective || lexicalCombo(left).localeCompare(lexicalCombo(right), "en");
      })[0];
      break;
    }
    if (chosenForces) break;
    if (level < maxConstraintLevel(roundScope, firstAfterLaneOverride)) relaxed.push({ round_scope: roundScope, from_level: level, to_level: level + 1 });
  }

  if (!chosenForces) {
    console.error(`B2 fail-loud: no valid ${roundScope} triplet after constraint relaxation`);
    return { state: clone(state), cards: [], trace: { fail_loud: "no_legal_triplet", final_k: finalK, max_k_attempted: maxKAttempted, k_attempts: kAttempts, lane_constraint_relaxed: relaxed } };
  }
  const cards = chosenForces.map((force) => preferredCard(state, force, roundScope));
  const next = markCardsShown(state, cards, true);
  next.debug.lane_constraint_relaxed.push(...relaxed);
  if (roundScope === "r3" && firstAfterLaneOverride) next.r3_first_pending = false;
  return { state: next, cards, trace: { final_k: finalK, max_k_attempted: maxKAttempted, k_attempts: kAttempts, lane_constraint_relaxed: relaxed } };
}

function pickCapabilityTriplet(state, force, cardKind, expectedValues, field) {
  const targetForce = force ?? state.headline_force;
  requireForce(targetForce);
  const cards = state.cards
    .filter((card) => card.force === targetForce && card.card_kind === cardKind && !state.shown.card_ids.includes(card.card_id))
    .sort((left, right) => expectedValues.indexOf(left[field]) - expectedValues.indexOf(right[field]) || compareCardId(left, right));
  if (cards.length !== 3 || new Set(cards.map((card) => card[field])).size !== 3) throw new Error(`need one ${cardKind} card for each level of ${targetForce}`);
  return { state: markCardsShown(state, cards, true), cards };
}

function pickPhiTriplet(state, force = state.headline_force) {
  return pickCapabilityTriplet(state, force, "phi", [0, 1, 2], "phi_level");
}

function pickOmegaTriplet(state, force = state.headline_force) {
  return pickCapabilityTriplet(state, force, "omega", ["owner", "team", "none"], "omega_value");
}

function pickStabilityTriplet(state, force = state.headline_force) {
  return pickCapabilityTriplet(state, force, "stability", STABILITY_LEVELS, "stability_level");
}

/** Applies one C-grade chosen/other theta-card observation group. */
function applyChoice(state, chosen, others) {
  const chosenCard = cardFor(state, chosen);
  const otherCards = others.map((card) => cardFor(state, card));
  if (chosenCard.card_kind !== "theta" || otherCards.length !== 2 || otherCards.some((card) => card.card_kind !== "theta")) {
    throw new Error("applyChoice requires one theta chosen card and two theta others");
  }
  const ids = [chosenCard, ...otherCards].map((card) => card.card_id);
  if (new Set(ids).size !== 3) throw new Error("applyChoice cards must be distinct");
  const next = clone(state);
  const chosenEntry = forceEntry(next, chosenCard.force);
  const chosenTarget = anchorTarget(chosenCard.anchor);
  chosenEntry.theta = clampTheta(chosenEntry.theta + LEARNING_RATE * CHOICE_WEIGHT * (chosenTarget - chosenEntry.theta));
  chosenEntry.sigma = Math.max(SIGMA_MIN, chosenEntry.sigma * (1 - 0.350 * CHOICE_WEIGHT));
  recordObservation(chosenEntry, CHOICE_WEIGHT);
  for (const card of otherCards) {
    const entry = forceEntry(next, card.force);
    const target = anchorTarget(card.anchor);
    entry.theta = clampTheta(entry.theta - 0.5 * LEARNING_RATE * CHOICE_WEIGHT * (target - entry.theta));
    entry.sigma = Math.max(SIGMA_MIN, entry.sigma * (1 - 0.175 * CHOICE_WEIGHT));
    recordObservation(entry, CHOICE_WEIGHT);
  }
  return next;
}

/** Applies an A-grade absolute frequency anchor. */
function applyFrequencyAnchor(state, force, thetaAbs) {
  requireForce(force);
  if (!FREQUENCY_LEVELS.includes(thetaAbs)) throw new Error(`invalid frequency level: ${thetaAbs}`);
  const next = clone(state);
  const entry = forceEntry(next, force);
  entry.theta = clampTheta(0.5 * entry.theta + 0.5 * thetaAbs);
  entry.sigma = Math.max(SIGMA_MIN, entry.sigma * 0.60);
  recordObservation(entry, ANCHOR_WEIGHT);
  return next;
}

/** Applies a B-grade recalled-event observation. */
function applyRecall(state, force, target) {
  requireForce(force);
  if (![0.5, 1.5, 2.5, 3.5, 4.5].includes(target)) throw new Error(`invalid recall target: ${target}`);
  const next = clone(state);
  const entry = forceEntry(next, force);
  entry.theta = clampTheta(entry.theta + LEARNING_RATE * RECALL_WEIGHT * (target - entry.theta));
  entry.sigma = Math.max(SIGMA_MIN, entry.sigma * (1 - 0.350 * RECALL_WEIGHT));
  recordObservation(entry, RECALL_WEIGHT);
  return next;
}

function evidenceRatio(state, force) {
  return forceEntry(state, force).evidence_ratio;
}

function laneScores(state) {
  return Object.fromEntries(LANE_ORDER.map((lane) => {
    const forces = FORCE_IDS.filter((force) => FORCE_LANES[force] === lane);
    return [lane, forces.reduce((sum, force) => sum + (3 - forceEntry(state, force).theta), 0) / forces.length];
  }));
}

/** The lane recommendation used by alignment A, with the required tie breakers. */
function recommendedLane(state) {
  const scores = laneScores(state);
  return [...LANE_ORDER].sort((left, right) => {
    if (scores[right] !== scores[left]) return scores[right] - scores[left];
    const leftMaxSigma = Math.max(...FORCE_IDS.filter((force) => FORCE_LANES[force] === left).map((force) => forceEntry(state, force).sigma));
    const rightMaxSigma = Math.max(...FORCE_IDS.filter((force) => FORCE_LANES[force] === right).map((force) => forceEntry(state, force).sigma));
    return rightMaxSigma - leftMaxSigma || LANE_ORDER.indexOf(left) - LANE_ORDER.indexOf(right);
  })[0];
}

/** Applies alignment A, including its same-value/no-correction behavior. */
function applyLaneOverride(state, newLane, { via = "option", systemValue = state.focus_lane ?? recommendedLane(state) } = {}) {
  requireLane(newLane);
  if (!CORRECTION_VIA.has(via)) throw new Error(`invalid correction via: ${via}`);
  const next = clone(state);
  next.focus_lane = newLane;
  if (newLane === systemValue) return next;
  for (const force of FORCE_IDS.filter((item) => FORCE_LANES[item] === newLane)) {
    next.forces[force].theta = Math.min(next.forces[force].theta, 2.0);
    next.forces[force].sigma = 1.2;
  }
  for (const force of FORCE_IDS.filter((item) => FORCE_LANES[item] === systemValue)) next.forces[force].deprioritized = true;
  next.r3_first_pending = true;
  next.corrections.push(correctionEvent({ at: "A", round: 2, field: "lane", system_value: systemValue, user_value: newLane, via }));
  return next;
}

/** Deterministically selects a headline force unless alignment B has named one. */
function selectHeadlineForce(state) {
  if (state.headline_force !== null) return state.headline_force;
  const candidates = FORCE_IDS.filter((force) => forceEntry(state, force).n_obs >= 2);
  if (candidates.length === 0) return null;
  return candidates.sort((left, right) => {
    const leftEntry = forceEntry(state, left); const rightEntry = forceEntry(state, right);
    return leftEntry.sigma - rightEntry.sigma || leftEntry.theta - rightEntry.theta || compareForceId(left, right);
  })[0];
}

/** The alignment-B system choice: the least-certain force inside focus_lane. */

      help: "最近一個月，平均一位客人一次消費多少。",
      placeholder: "例如 1500",
      quote: (value) => `以你說的最近一個月客單價約 ${value} 元來看。`,
    },
    monthly_revenue: {
      select_label: "月營收（元，最近一個月大概的營業額）",
      input_label: "月營收",
      unit: "元",
      help: "最近一個月大概的營業額。",
      placeholder: "例如 300000",
      quote: (value) => `以你說的最近一個月月營收約 ${value} 元來看。`,
    },
  });
  const UI_COPY = Object.freeze({
    eyebrow: "互動診斷體驗",
    notice: "此流程只在目前裝置中進行，不會儲存資料或連線。",
    genericError: "暫時無法繼續，請重新開始。",
    recommendation: "我們已整理出一個適合繼續討論的方向。",
    nextStep: "如果你願意，我們可以先從目前最卡的一件事開始釐清。",
    engaged: "你目前已有進行中的服務，先把焦點放在最需要推進的一步。",
  });
  const DISPLAY = Object.freeze({
    verdict: {
      CONSULT: "先一起釐清問題與優先順序",
      COACH: "用陪跑方式建立可持續的節奏",
      DELEGATE: "協助團隊接住並推進這件事",
      ASSIGN: "先補上合適的承接安排",
      SYSTEM: "把有效做法整理成可複製的流程",
      AMPLIFY: "放大已經有效的做法",
      SUCCESSION_RISK: "提早安排交接與延續",
      MEASURE_FIRST: "先補齊觀察，再決定下一步",
    },
    capability: {
      phi: { 0: "方法仍在摸索", 1: "已有做法，仍可調整", 2: "方法已可穩定運作" },
      omega: { owner: "目前主要由你承擔", team: "團隊可以承接", none: "目前缺少承接者" },
      stability: { once: "剛開始嘗試", occasional: "偶爾才會執行", fixed: "已有固定節奏" },
    },
  });

  const runtime = {
    phase: "r1",
    state: null,
    company: null,
    current: null,
    r2Triplets: 0,
    r3Triplets: 0,
    openingForce: null,
    dismissedSymptoms: [],
    budgetChoice: null,
    pastExperience: null,
    actions: [],
  };

  function esc(value) {
    return String(value).replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]);
  }

  // Presentation boundary: renderers may receive raw engine values, but only
  // these helpers may translate them into visible copy.
  function displayForce(force) {
    return content.force_labels[force] ?? "這項能力";
  }

  function displayLane(lane) {
    return content.lane_labels[lane] ?? "目前焦點";
  }

  function displayVerdict(result) {
    return DISPLAY.verdict[result?.code] ?? "先釐清下一步";
  }

  function displayCapability(kind, value) {
    return DISPLAY.capability[kind]?.[value] ?? "目前狀況待確認";
  }

  function displayCapabilitySummary(phi, omega) {
    return `${displayCapability("phi", phi)}；${displayCapability("omega", omega)}。`;
  }

  function displayEvidenceNote(state) {
    return state.budget.missing_stability_note
      ? "這次先依目前掌握的回答整理方向，之後可以再補充細節。"
      : "這個方向已綜合你剛才提供的回答。";
  }

  function displayCorrection(entry) {
    if (entry.field === "lane") return `焦點由「${displayLane(entry.system_value)}」調整為「${displayLane(entry.user_value)}」。`;
    if (entry.field === "headline_force") return `優先處理項目由「${displayForce(entry.system_value)}」調整為「${displayForce(entry.user_value)}」。`;
    if (entry.field === "phi") return `方法狀況調整為「${displayCapability("phi", entry.user_value)}」。`;
    if (entry.field === "omega") return `承接安排調整為「${displayCapability("omega", entry.user_value)}」。`;
    if (entry.field === "symptom") return "已略過一項不符合你的描述。";
    return "已依你的回答調整方向。";
  }

  function metricFor(kind) {
    const metric = METRICS[kind];
    if (!metric) throw new Error(`unknown R1 metric kind: ${kind}`);
    return metric;
  }

  function displayNumber(value) {
    const number = Number(value);
    return Number.isFinite(number) ? new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 2 }).format(number) : String(value);
  }

  function companyMetricQuote() {
    if (!runtime.company) return "";
    const metric = metricFor(runtime.company.metric_kind);
    return metric.quote(displayNumber(runtime.company.metric_value));
  }

  function syncMetricField() {
    const select = document.getElementById("metric-kind");
    if (!select) return;
    const metric = metricFor(select.value);
    document.getElementById("metric-value-label").textContent = metric.input_label;
    document.getElementById("metric-value").placeholder = metric.placeholder;
    document.getElementById("metric-unit").textContent = metric.unit;
    document.getElementById("metric-help").textContent = metric.help;
  }

  function phaseRound() {
    return runtime.phase.slice(0, 2);
  }

  function renderShell(title, lead, body) {
    const currentRound = phaseRound();
    root.innerHTML = `<main class="shell">
      <header><p class="eyebrow">${esc(UI_COPY.eyebrow)}</p><h1>商模十二力互動診斷</h1>
      <p class="notice">${esc(UI_COPY.notice)}</p></header>
      <ol class="progress">${ROUNDS.map(([id, text]) => `<li class="${id === currentRound ? "active" : ""}">${esc(text)}</li>`).join("")}</ol>
      <section class="panel" data-testid="phase-${esc(runtime.phase)}"><h2>${esc(title)}</h2><p class="lead">${esc(lead)}</p>${body}</section>
      <footer><small data-testid="action-count">依照你的實際情況作答即可。</small></footer>
    </main>`;
  }

  function button(action, label, value = "", testId = "") {
    return `<button type="button" data-action="${esc(action)}" data-value="${esc(value)}"${testId ? ` data-testid="${esc(testId)}"` : ""}>${esc(label)}</button>`;
  }

  function record(action, detail) {
    runtime.actions.push({ action, detail });
  }

  function smallestSigma(forces = FORCE_IDS) {
    return [...forces].sort((left, right) => runtime.state.forces[left].sigma - runtime.state.forces[right].sigma || left.localeCompare(right, "en"))[0];
  }

  function focusForces() {
    return FORCE_IDS.filter((force) => FORCE_LANES[force] === runtime.state.focus_lane);
  }

  function startR2Triplet() {
    const result = runtime.r2Triplets === 0
      ? pickOpeningTriplet(runtime.state)
      : pickTriplet(runtime.state, { roundScope: "r2" });
    if (result.cards.length !== 3) throw new Error(`R2 cannot produce a triplet: ${result.trace?.fail_loud ?? "unknown"}`);
    runtime.state = result.state;
    runtime.current = { cards: result.cards, round: "r2", ordinal: runtime.r2Triplets + 1 };
    runtime.phase = "r2-cards";
  }

  function startR3Triplet() {
    const result = pickTriplet(runtime.state, { roundScope: "r3" });
    if (result.cards.length !== 3) throw new Error(`R3 cannot produce a triplet: ${result.trace?.fail_loud ?? "unknown"}`);
    runtime.state = result.state;
    runtime.current = { cards: result.cards, round: "r3", ordinal: runtime.r3Triplets + 1, trace: result.trace };
    runtime.phase = "r3-cards";
  }

  function startCapability(kind) {
    const picker = { phi: pickPhiTriplet, omega: pickOmegaTriplet, stability: pickStabilityTriplet }[kind];
    const result = picker(runtime.state, runtime.state.headline_force);
    runtime.state = result.state;
    runtime.current = { cards: result.cards, kind };
    runtime.phase = `r4-${kind}`;
  }

  function renderR1() {
    renderShell("第 1 輪｜公司輪廓", "填一個有期間與單位的數字，幫我們理解你目前的狀況。", `
      <form id="r1-form" data-testid="r1-form">
        <label>產業<input name="industry" required value="顧問服務"></label>
        <label>經營年數<input name="years" type="number" min="0" required value="3"></label>
        <label>團隊人數<input name="headcount" type="number" min="1" required value="4"></label>
        <label>真實數字類型<select id="metric-kind" name="metric_kind" data-testid="metric-kind">${Object.entries(METRICS).map(([value, metric]) => `<option value="${esc(value)}">${esc(metric.select_label)}</option>`).join("")}</select></label>
        <label><span id="metric-value-label">上月來客數</span><span class="metric-input"><input id="metric-value" name="metric_value" type="number" inputmode="decimal" min="0" required value="610" placeholder="例如 610" aria-describedby="metric-help" data-testid="metric-value"><span id="metric-unit" class="metric-unit" data-testid="metric-unit">位</span></span><small id="metric-help" class="metric-help" data-testid="metric-help">上一個月成交的客人數。</small></label>
        <button type="submit" data-testid="r1-submit">開始廣泛掃描</button>
      </form>`);
    syncMetricField();
  }

  function renderCards(round) {
    const { cards, ordinal } = runtime.current;
    renderShell(`第 ${round === "r2" ? "2" : "3"} 輪｜第 ${ordinal} 組三選一`, "選最接近現在的那張，讓我們逐步聚焦。", `
      <div class="cards">${cards.map((card) => `<article class="card"><p>${esc(card.prompt)}</p><strong>${esc(card.option)}</strong>
      ${button("choose-card", "選這張", card.card_id, `choice-${card.card_id}`)}</article>`).join("")}</div>`);
  }

  function renderRecall(title, force, nextAction, round) {
    const frame = content.recall_frames?.[force] ?? `請回想 ${displayForce(force)} 最近一次的實際情況。`;
    renderShell(title, `請回想 ${displayForce(force)} 最近一次的實際情況。`, `<p class="summary">${esc(frame)}</p>
      <div class="choices">${FREQUENCY_CHOICES.map(([value, text]) => button(nextAction, text, `${force}|${value}`, `recall-${value}`)).join("")}</div>
      <p class="hint">選最接近你真實感受的答案。</p>`);
  }

  function renderAlignmentA() {
    const system = recommendedLane(runtime.state);
    renderShell("第 2 輪｜對齊 A：先選哪個方向", "先選一個最值得聚焦的方向；你可以確認或調整。", `
      <p class="summary">建議先看「${esc(displayLane(system))}」。</p>
      <div class="choices">${[system, ...Object.keys(content.lane_labels).filter((lane) => lane !== system)].map((lane, index) => button("align-a", index === 0 ? `確認：${displayLane(lane)}` : `改選：${displayLane(lane)}`, lane, `align-a-${lane}`)).join("")}</div>`);
  }

  function renderAlignmentB() {
    const system = recommendedRootCause(runtime.state);
    const candidates = [system, ...focusForces().filter((force) => force !== system)];
    renderShell("第 3 輪｜對齊 B：最需要處理的是哪一項", "我們先把最需要確認的一項放在第一位。", `
      <p class="summary">建議先處理：${esc(displayForce(system))}。</p>
      <div class="choices">${candidates.map((force, index) => button("align-b", index === 0 ? `確認：${displayForce(force)}` : `改選：${displayForce(force)}`, force, `align-b-${force.toLowerCase()}`)).join("")}</div>`);
  }

  function renderFrequencyAnchor() {
    const force = runtime.state.headline_force;
    renderShell("第 4 輪｜把重點落到真實頻率", `目前先聚焦在 ${displayForce(force)}；請選最接近的頻率。`, `<div class="choices">${FREQUENCY_CHOICES.map(([value, text]) => button("headline-anchor", text, String(value), `headline-anchor-${value}`)).join("")}</div>`);
  }

  function renderCapability(kind) {
    const labels = { phi: "方法成熟度", omega: "主要承接者", stability: "穩定週期" };
    renderShell(`第 4 輪｜${labels[kind]}`, `這一題聚焦在 ${displayForce(runtime.state.headline_force)}。`, `<div class="cards">${runtime.current.cards.map((card) => `<article class="card"><p>${esc(card.prompt)}</p><strong>${esc(card.option)}</strong>${button("choose-capability", "選這張", card.card_id, `capability-${card.card_id}`)}</article>`).join("")}</div>`);
  }

  function renderAlignmentC() {
    const short = runtime.state.budget.alignment_summary_variant === "short";
    const systemPhi = runtime.state.capability.phi;
    const systemOmega = runtime.state.capability.omega;
    renderShell("第 4 輪｜對齊 C：方法與承接安排", short ? "時間有限，先確認最重要的安排。" : "確認目前的安排，或改成更符合你的組合。", `
      <p class="summary">目前建議：${esc(displayCapabilitySummary(systemPhi, systemOmega))}</p>
      <div class="choices">${button("align-c", "確認這個安排", "same", "align-c-same")}
      ${[0, 1, 2].flatMap((phi) => ["owner", "team", "none"].map((omega) => button("align-c", `改為：${displayCapabilitySummary(phi, omega)}`, `${phi}|${omega}`, `align-c-${phi}-${omega}`))).join("")}</div>`);
  }

  function renderConclusion() {
    const result = finalVerdict(runtime.state);
    const headline = runtime.state.headline_force;
    const ranking = [...FORCE_IDS].sort((a, b) => runtime.state.forces[a].theta - runtime.state.forces[b].theta || a.localeCompare(b, "en")).slice(0, 4);
    const availableSymptoms = content.symptoms.filter((item) => item.force === headline && !runtime.dismissedSymptoms.includes(item.card_id));
    const guard = budgetGuard({ checkpoint: "before_conclusion", now, startedAt, optionalSections: [{ id: "risk" }, { id: "journey" }] });
    runtime.state = applyBudgetGuard(runtime.state, guard);
    const corrections = correctionAudit(runtime.state);
    renderShell("第 5 輪｜診斷結論", "這是根據你剛才的回答整理出的下一步方向。", `
      <p class="verdict" data-testid="verdict">${esc(displayVerdict(result))}</p>
      <p class="summary" data-testid="metric-reference">${esc(companyMetricQuote())}</p>
      <p><strong>目前最需要處理：</strong>${esc(displayForce(headline))}</p>
      <p><strong>接著值得留意：</strong>${ranking.map(displayForce).map(esc).join("、")}</p>
      <section><h3>症狀校正</h3>${availableSymptoms.length ? availableSymptoms.map((item) => `<p>${esc(item.text)} ${button("dismiss-symptom", "這句不像我", item.card_id, `symptom-${item.rank}`)}</p>`).join("") : "<p>這一項的描述已全部略過。</p>"}</section>
      <section><h3>你的調整紀錄（${corrections.count}）</h3><ul>${corrections.entries.map((entry) => `<li>${esc(displayCorrection(entry))}</li>`).join("") || "<li>目前沒有調整。</li>"}</ul></section>
      <p class="hint">${esc(displayEvidenceNote(runtime.state))}</p>
      ${button("to-r6", "前往推薦頁", "", "to-r6")}`);
  }

  function renderBudget() {
    renderShell("第 6 輪｜投入範圍", "先選擇你目前可以接受的投入範圍。", `<div class="choices">${[
      ["none", "暫不投入"], ["under_10k", "低於一萬元"], ["10k_50k", "一到五萬元"], ["50k_200k", "五到二十萬元"], ["over_200k", "高於二十萬元"],
    ].map(([value, label]) => button("budget", label, value, `budget-${value}`)).join("")}</div>`);
  }

  function renderPastExperience(group = null) {
    if (group) {
      renderShell("第 6 輪｜補一個原因", "選一個最接近的原因，讓我們更了解你的經驗。", `<div class="choices">${PAST_DETAILS[group].map(([value, label]) => button("past", label, value, `past-${value.replace(/[:_]/g, "-")}`)).join("")}</div>`);
      return;
    }
    renderShell("第 6 輪｜過去經驗", "選一個最接近的選項；需要時會再問一個原因。", `<div class="choices">${PAST_MAIN.map(([value, label]) => button("past-main", label, value, `past-main-${value}`)).join("")}</div>`);
  }

  function renderRecommendation() {
    const result = routeFor(runtime.state, content.routes, runtime.pastExperience);
    const route = result;
    const product = route.products[0];
    renderShell("推薦頁｜下一步", "根據你的回答，這裡是適合繼續討論的方向。", product ? `
      <p data-testid="route-key" data-route-key="${esc(result.verdict.code)}/${esc(runtime.pastExperience)}">${esc(UI_COPY.recommendation)}</p>
      <h3>下一步建議</h3><p>${esc(UI_COPY.nextStep)}</p>
      <a class="cta" href="${esc(product.cta_url)}" target="_blank" rel="noopener" data-testid="cta">開始下一步</a>` : `
      <p data-testid="route-key" data-route-key="${esc(result.verdict.code)}/${esc(runtime.pastExperience)}">${esc(UI_COPY.engaged)}</p>`);
  }

  function render() {
    if (runtime.phase === "r1") return renderR1();
    if (runtime.phase === "r2-cards") return renderCards("r2");
    if (runtime.phase === "r2-recall-opening") return renderRecall("第 2 輪｜回想一個實例", runtime.openingForce, "r2-recall-opening", "r2");
    if (runtime.phase === "r2-recall-smallest") return renderRecall("第 2 輪｜再校準一力", smallestSigma(), "r2-recall-smallest", "r2");
    if (runtime.phase === "r2-align") return renderAlignmentA();
    if (runtime.phase === "r3-cards") return renderCards("r3");
    if (runtime.phase === "r3-recall") return renderRecall("第 3 輪｜回想焦點賽道", smallestSigma(focusForces()), "r3-recall", "r3");
    if (runtime.phase === "r3-align") return renderAlignmentB();
    if (runtime.phase === "r4-anchor") return renderFrequencyAnchor();
    if (runtime.phase === "r4-phi" || runtime.phase === "r4-omega" || runtime.phase === "r4-stability") return renderCapability(runtime.current.kind);
    if (runtime.phase === "r4-align") return renderAlignmentC();
    if (runtime.phase === "r5") return renderConclusion();
    if (runtime.phase === "r6-budget") return renderBudget();
    if (runtime.phase === "r6-past") return renderPastExperience();
    if (runtime.phase.startsWith("r6-detail-")) return renderPastExperience(runtime.phase.slice("r6-detail-".length));
    if (runtime.phase === "r6-recommendation") return renderRecommendation();
    throw new Error(`unknown UI phase ${runtime.phase}`);
  }

  function chooseCard(cardId) {
    const selected = runtime.current.cards.find((card) => card.card_id === cardId);
    if (!selected) throw new Error("selected theta card is not in current triplet");
    runtime.state = applyChoice(runtime.state, selected, runtime.current.cards.filter((card) => card.card_id !== cardId));
    record("choose-card", cardId);
    if (runtime.current.round === "r2") {
      runtime.r2Triplets += 1;
      if (runtime.r2Triplets === 1) {
        runtime.openingForce = selected.force;
        runtime.phase = "r2-recall-opening";
      } else if (runtime.r2Triplets < 4) startR2Triplet();
      else runtime.phase = "r2-recall-smallest";
      return;
    }
    runtime.r3Triplets += 1;
    if (runtime.r3Triplets === 1) runtime.phase = "r3-recall";
    else if (runtime.r3Triplets < 4) startR3Triplet();
    else runtime.phase = "r3-align";
  }

  function chooseCapability(cardId) {
    const card = runtime.current.cards.find((item) => item.card_id === cardId);
    if (!card) throw new Error("selected capability card is not in current triplet");
    const kind = runtime.current.kind;
    if (kind === "phi") runtime.state = applyPhiSelection(runtime.state, card);
    if (kind === "omega") runtime.state = applyOmegaSelection(runtime.state, card);
    if (kind === "stability") runtime.state = applyStabilitySelection(runtime.state, card);
    record("choose-capability", cardId);
    if (kind === "phi") startCapability("omega");
    else if (kind === "omega") {
      const guard = budgetGuard({ checkpoint: "before_alignment_c", now, startedAt });
      runtime.state = applyBudgetGuard(runtime.state, guard);
      if (runtime.state.capability.stability_skipped) runtime.phase = "r4-align";
      else startCapability("stability");
    } else {
      runtime.phase = "r4-align";
    }
  }

  function dispatch(action, value) {
    if (action === "start") {
      const form = document.getElementById("r1-form");
      if (!form.reportValidity()) return;
      const values = Object.fromEntries(new FormData(form));
      runtime.company = values;
      runtime.state = createDiagnosisState({ cards: content.cards, openingTriplet: content.opening_triplet });
      record("start", values.industry);
      startR2Triplet();
    } else if (action === "choose-card") chooseCard(value);
    else if (action === "r2-recall-opening") {
      const [force, level] = value.split("|"); runtime.state = applyRecall(runtime.state, force, Number(level)); record(action, value); startR2Triplet();
    } else if (action === "r2-recall-smallest") {
      const [force, level] = value.split("|"); runtime.state = applyRecall(runtime.state, force, Number(level)); record(action, value); runtime.phase = "r2-align";
    } else if (action === "align-a") {
      runtime.state = applyLaneOverride(runtime.state, value); record(action, value); startR3Triplet();
    } else if (action === "r3-recall") {
      const [force, level] = value.split("|"); runtime.state = applyRecall(runtime.state, force, Number(level)); record(action, value); startR3Triplet();
    } else if (action === "align-b") {
      runtime.state = applyRootCauseOverride(runtime.state, value); record(action, value); runtime.phase = "r4-anchor";
    } else if (action === "headline-anchor") {
      runtime.state = applyFrequencyAnchor(runtime.state, runtime.state.headline_force, Number(value));
      const guard = budgetGuard({ checkpoint: "before_r4_cards", now, startedAt });
      runtime.state = applyBudgetGuard(runtime.state, guard);
      record(action, value);
      startCapability("phi");
    } else if (action === "choose-capability") chooseCapability(value);
    else if (action === "align-c") {
      if (value !== "same") { const [phi, omega] = value.split("|"); runtime.state = applyCapabilityOverride(runtime.state, { phi: Number(phi), omega }); }
      record(action, value); runtime.phase = "r5";
    } else if (action === "dismiss-symptom") {
      if (!runtime.dismissedSymptoms.includes(value)) {
        runtime.dismissedSymptoms.push(value);
        runtime.state = appendCorrection(runtime.state, { at: "conclusion", round: 5, field: "symptom", system_value: value, user_value: "not_me", via: "option" });
      }
      record(action, value);
    } else if (action === "to-r6") { record(action, ""); runtime.phase = "r6-budget"; }
    else if (action === "budget") { runtime.budgetChoice = value; record(action, value); runtime.phase = "r6-past"; }
    else if (action === "past-main") {
      record(action, value);
      if (PAST_DETAILS[value]) runtime.phase = `r6-detail-${value}`;
      else { runtime.pastExperience = value; runtime.phase = "r6-recommendation"; }
    } else if (action === "past") { runtime.pastExperience = value; record(action, value); runtime.phase = "r6-recommendation"; }
    else throw new Error(`unknown action ${action}`);
  }

  document.addEventListener("submit", (event) => {
    if (event.target.id !== "r1-form") return;
    event.preventDefault();
    safely(() => dispatch("start", ""));
  });
  document.addEventListener("click", (event) => {
    const target = event.target.closest("[data-action]");
    if (!target) return;
    safely(() => dispatch(target.dataset.action, target.dataset.value ?? ""));
  });
  document.addEventListener("change", (event) => {
    if (event.target.id === "metric-kind") syncMetricField();
  });

  function safely(work) {
    try { work(); render(); }
    catch (error) {
      const detail = String(error?.stack ?? error);
      errors.push(detail);
      console.error(error);
      root.innerHTML = `<main class="shell"><h1>流程暫停</h1><p data-testid="runtime-error">${esc(UI_COPY.genericError)}</p></main>`;
    }
  }

  window.__b25 = {
    snapshot: () => ({ phase: runtime.phase, errors: [...errors], actions: [...runtime.actions], headline: runtime.state?.headline_force ?? null, corrections: runtime.state ? correctionAudit(runtime.state).count : 0, final: runtime.state ? finalVerdict(runtime.state) : null }),
    content,
  };
  render();
})();
</script>
